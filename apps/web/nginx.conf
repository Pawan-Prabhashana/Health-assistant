# nginx site configuration for the Sahana web client.
#
# Serves the built single-page application on port 8080 and reverse-proxies API
# traffic to the api container. The trailing slash on proxy_pass strips the /api
# prefix, so a browser request to /api/health/ready reaches the backend as
# /health/ready. The chat stream has its own location with buffering disabled so
# Server-Sent Events arrive incrementally (see ADR 0014).

upstream sahana_api {
    server api:8000;
    # Keep an idle connection to the backend so streamed responses reuse a warm
    # HTTP/1.1 connection instead of reconnecting per request.
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers on every response (see the snippet for the CSP rationale).
    include /etc/nginx/snippets/security-headers.conf;

    # Compress text assets; images and archives are already compressed.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Local liveness endpoint for the container healthcheck. Does not touch the
    # api service, so nginx readiness is independent of backend readiness.
    location = /healthz {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Chat streaming (SSE). Buffering MUST be off here or nginx accumulates the
    # whole response and delivers the tokens in one lump at the end, freezing the
    # visible stream. proxy_buffering/proxy_cache off flush each frame; HTTP/1.1
    # with an empty Connection header keeps the upstream connection open for
    # chunked streaming; the long read timeout tolerates slow model output; and
    # the backend's X-Accel-Buffering: no is honoured because buffering is off.
    location = /api/chat/stream {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://sahana_api/chat/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding on;
    }

    # Reverse proxy to the FastAPI backend for all other API calls. The trailing
    # slash rewrites /api/<path> to /<path> on the upstream.
    location /api/ {
        proxy_pass http://sahana_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets are immutable; cache them aggressively.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths return index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
