# nginx site configuration for the Sahana web client.
#
# Serves the built single-page application on port 8080 and reverse-proxies
# API traffic to the api container. The trailing slash on proxy_pass strips the
# /api prefix, so a browser request to /api/health/ready reaches the backend as
# /health/ready.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets; images and archives are already compressed.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Local liveness endpoint for the container healthcheck. Does not touch the
    # api service, so nginx readiness is independent of backend readiness.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Reverse proxy to the FastAPI backend. The trailing slash rewrites
    # /api/<path> to /<path> on the upstream.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets are immutable; cache them aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths return index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
