# Security response headers for the Sahana web server.
#
# Included at the server level and re-included in any location that sets its own
# add_header (nginx drops inherited add_header directives from a block that
# defines even one), so every response carries the same headers. `always` emits
# them on error responses too.
#
# Content-Security-Policy: the SPA serves its own hashed JS/CSS and talks only to
# the same origin under /api (including the streaming fetch), so default-src,
# script-src, and connect-src are 'self'. style-src allows 'unsafe-inline'
# because inline <style> blocks are a normal part of bundled CSS delivery;
# img-src allows data: for small inlined images. Framing is blocked via
# frame-ancestors 'none' (and the legacy X-Frame-Options header below). No
# external origins are permitted, so CDNs, trackers, and inline scripts are
# refused. HSTS is intentionally not set here: TLS is terminated upstream in real
# deployments, so Strict-Transport-Security belongs at that edge (see ADR 0014).
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
