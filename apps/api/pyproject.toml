[project]
name = "sahana-api"
version = "0.1.0"
description = "Sahana hospital health assistant API (FastAPI backend)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Pawan Prabhashana" }]
dependencies = [
    "fastapi>=0.116.1,<0.117",
    "uvicorn[standard]>=0.35.0,<0.36",
    "pydantic>=2.11.7,<3",
    "pydantic-settings>=2.10.1,<3",
    "structlog>=25.4.0,<26",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30.0,<0.31",
    "alembic>=1.16.0,<2",
    "phonenumbers>=8.13.0,<10",
    "qdrant-client>=1.12.0,<2",
    "fastembed>=0.4.0,<0.8",
    "openai>=1.50.0,<2",
    "tiktoken>=0.8.0,<0.12",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.17.1,<2",
    "ruff>=0.12.7,<0.13",
    "pytest>=8.4.1,<9",
    "pytest-asyncio>=1.1.0,<2",
    "httpx>=0.28.1,<0.29",
    "testcontainers>=4.9.0,<5",
    "psycopg2-binary>=2.9.9,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sahana_api"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["sahana_api"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "pg: tests that require a real Postgres (via testcontainers); skipped when Docker is unavailable.",
    "qdrant: tests that require a real Qdrant (via testcontainers); skipped when Docker is unavailable.",
]
filterwarnings = [
    # The pinned Qdrant test image is older than the client; production Qdrant
    # Cloud is version-matched, so this advisory check-warning is test-only noise.
    "ignore:Qdrant client version.*incompatible with server version:UserWarning",
    "ignore:Failed to obtain server version.*:UserWarning",
]

[tool.coverage.run]
branch = true
source = ["src/sahana_api"]
