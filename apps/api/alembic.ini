# Alembic configuration.
#
# The database URL is intentionally left blank here: alembic/env.py resolves it
# from the application Settings (``database_migration_url``), keeping a single
# source of configuration and no secrets in this file. Tests override it by
# setting ``sqlalchemy.url`` on the Config object programmatically.

[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
sqlalchemy.url =

[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
