name: sahana

services:
  api:
    build:
      context: ./apps/api
    image: sahana-api:latest
    restart: unless-stopped
    # Every backend variable is read from .env (copy .env.docker.example first).
    # The fastembed cache dir is fixed to the mounted volume path here so it can
    # never be misconfigured from the environment file.
    env_file:
      - .env
    environment:
      SAHANA_FASTEMBED_CACHE_DIR: /app/.cache/huggingface/fastembed
    volumes:
      # Local MiniLM embedder + tokenizer caches persist across restarts and
      # download only once (see the healthcheck start_period below).
      - hf_cache:/app/.cache/huggingface
    networks:
      - sahana
    # Liveness only, so a missing external dependency (DB, Qdrant, keys) never
    # flaps the container. start_period is generous to absorb the one-time model
    # download into hf_cache on first boot; steady-state checks stay tight.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2).status == 200 else sys.exit(1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    # The api carries the ONNX MiniLM embedder; cap memory so it cannot starve
    # the host, but reserve enough that the embedder is never OOM-killed.
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m

  web:
    build:
      context: ./apps/web
    image: sahana-web:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - sahana
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 64m

  # One-shot knowledge-base ingestion into Qdrant. RAG returns nothing until this
  # runs; it is idempotent (Phase 2), so it is safe to run on every deploy. Not
  # started by default — it lives behind the `tools` profile:
  #   docker compose --profile tools run --rm ingest
  ingest:
    image: sahana-api:latest
    profiles:
      - tools
    env_file:
      - .env
    environment:
      SAHANA_FASTEMBED_CACHE_DIR: /app/.cache/huggingface/fastembed
    # The corpus lives at the repo root (outside the api build context), so it is
    # mounted read-only and passed as --root rather than baked into the image.
    command: ["python", "-m", "sahana_api.kb.ingest", "--path", "/data/kb"]
    volumes:
      - hf_cache:/app/.cache/huggingface
      - ./data/kb:/data/kb:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - sahana
    restart: "no"

networks:
  sahana:
    driver: bridge

volumes:
  hf_cache:
    # Persists the local fastembed MiniLM model and the tiktoken vocabulary so
    # they download once and survive restarts.
